[project]
name = "pixane"
version = "0.1.0"
description = "Éditeur photo avec retouche par IA (ComfyUI en moteur caché)"
requires-python = ">=3.11"
license-files = ["LICENSE", "LICENSE.en.txt"]
authors = [{ name = "Georges Christophe (chrypox)" }]
dependencies = ["PySide6-Essentials>=6.8", "numpy>=2.0", "Pillow>=11.0", "websocket-client>=1.8",
                "pyphen>=0.18", "spylls>=0.1.7", "rawpy>=0.27",
                "openexr>=3.5", "opencv-python-headless>=4.10", "vtracer>=0.6"]

[project.gui-scripts]
pixane = "pixane.__main__:main"
